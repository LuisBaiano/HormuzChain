version: '3.8'
services:
  broker1:
    build:
      context: ./code
      dockerfile: Dockerfile.broker
    container_name: hormuznet_broker1
    network_mode: host
    command:
    - -id=B1
    - -setor=Setor_Noroeste
    - -udp=224.1.2.3:9876
    - -tcp=0.0.0.0:6000
    environment:
      ENABLE_TOKEN_REPLENISHMENT: 'true'
    restart: on-failure
  broker2:
